services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workspace_test
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - workspace-postgres-integration:/var/lib/postgresql/data

volumes:
  workspace-postgres-integration:
