name: Basic checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
          npm ci
      - name: Check generated contracts
        run: npm run check:contracts
      - name: JavaScript tests
        run: npm run test:js
      - name: Python runtime boundary and contract tests
        run: uv run --frozen pytest -q tests/test_runtime_import_boundary.py tests/test_runtime_contracts.py
