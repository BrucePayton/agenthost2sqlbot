  <text x="35.0" y="48.0" font-size="24" font-weight="700">07 · 功能实施状态与真实验收门禁</text>
  <rect x="45.0" y="100.0" width="330.0" height="72.0" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="55.0" y="124.0" font-size="13" font-weight="700">蓝/绿实线</text>
  <text x="55.0" y="143.0" font-size="13" font-weight="400">源码或运行已验证</text>
  <rect x="400.0" y="100.0" width="350.0" height="72.0" rx="9" fill="#FFEBEE" stroke="#D32F2F" stroke-width="3" stroke-dasharray="8 4" />
  <text x="410.0" y="124.0" font-size="13" font-weight="700">红色粗虚线</text>
  <text x="410.0" y="143.0" font-size="13" font-weight="400">未满足报告，需开发</text>
  <rect x="775.0" y="100.0" width="340.0" height="72.0" rx="9" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" />
  <text x="785.0" y="124.0" font-size="13" font-weight="700">紫色边框</text>
  <text x="785.0" y="143.0" font-size="13" font-weight="400">仅测试阶段接受</text>
  <rect x="1140.0" y="100.0" width="620.0" height="72.0" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="1150.0" y="124.0" font-size="13" font-weight="700">真实验收门禁</text>
  <text x="1150.0" y="143.0" font-size="13" font-weight="400">同源资产、部署 Secret 与运行凭证齐备后执行 E2E</text>
  <text x="45.0" y="235.0" font-size="19" font-weight="700">A. 与报告逐项对齐的硬约束</text>
  <rect x="45.0" y="265.0" width="505.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="55.0" y="289.0" font-size="13" font-weight="700">§1/§5 · 创建不经 Host</text>
  <text x="55.0" y="308.0" font-size="13" font-weight="400">前端直连 Data MCP REST；Host 只在对话时登场</text>
  <rect x="580.0" y="265.0" width="505.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="590.0" y="289.0" font-size="13" font-weight="700">§2 · 单一逻辑 Data MCP</text>
  <text x="590.0" y="308.0" font-size="13" font-weight="400">REST、data.ask、Ticket、回调、权限与缓存同属一个逻辑域</text>
  <rect x="1115.0" y="265.0" width="505.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="1125.0" y="289.0" font-size="13" font-weight="700">§3 · 一智能体一 Assistant</text>
  <text x="1125.0" y="308.0" font-size="13" font-weight="400">一个 data_agent 映射一个 SQLBot type=1 高级小助手</text>
  <rect x="1650.0" y="265.0" width="505.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="1660.0" y="289.0" font-size="13" font-weight="700">§4/§7 · ≤5 数据集 + 字段投影</text>
  <text x="1660.0" y="308.0" font-size="13" font-weight="400">授权后 Top40；cannot_generate 时仅一次 Top100</text>
  <rect x="45.0" y="410.0" width="505.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="55.0" y="434.0" font-size="13" font-weight="700">§4/§10 · 权限烘入虚拟表</text>
  <text x="55.0" y="453.0" font-size="13" font-weight="400">使用 tables[].fields 与 tables[].sql；不使用</text>
  <text x="55.0" y="472.0" font-size="13" font-weight="400">SQLBot rule</text>
  <rect x="580.0" y="410.0" width="505.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="590.0" y="434.0" font-size="13" font-weight="700">§1/§8 · SQLBot 零改码</text>
  <text x="590.0" y="453.0" font-size="13" font-weight="400">只使用高级小助手、SSE、Record Data 与直接数据库执行</text>
  <rect x="1115.0" y="410.0" width="505.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="1125.0" y="434.0" font-size="13" font-weight="700">§6/§9 · Host 分析、前端画图</text>
  <text x="1125.0" y="453.0" font-size="13" font-weight="400">Data MCP 返回 rows≤200；前端原生图表组件渲染</text>
  <rect x="1650.0" y="410.0" width="505.0" height="108.0" rx="9" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="1660.0" y="434.0" font-size="13" font-weight="700">§3/§11 · Host 不存智能体主数据</text>
  <text x="1660.0" y="453.0" font-size="13" font-weight="400">智能体、dataset、ask_session、ticket、cache 均归</text>
  <text x="1660.0" y="472.0" font-size="13" font-weight="400">Data MCP</text>
  <text x="45.0" y="615.0" font-size="19" font-weight="700">B. 开发清单与替换位置</text>
  <rect x="45.0" y="650.0" width="680.0" height="165.0" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="55.0" y="674.0" font-size="13" font-weight="700">Agent Host</text>
  <text x="55.0" y="693.0" font-size="13" font-weight="400">ClaudeAgentRuntime；可信会话；进程内 data.ask；结果组件与 AG-UI</text>
  <text x="55.0" y="712.0" font-size="13" font-weight="400">落点：app/runtime/claude.py · app/web</text>
  <rect x="760.0" y="650.0" width="680.0" height="165.0" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="770.0" y="674.0" font-size="13" font-weight="700">Data Agent 编排</text>
  <text x="770.0" y="693.0" font-size="13" font-weight="400">智能体 REST/表、Ticket、回调、字段投影、TTL 缓存、审计</text>
  <text x="770.0" y="712.0" font-size="13" font-weight="400">落点：app/data_mcp</text>
  <rect x="1475.0" y="650.0" width="680.0" height="165.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="1485.0" y="674.0" font-size="13" font-weight="700">外部 Asset ACL MCP</text>
  <text x="1485.0" y="693.0" font-size="13" font-weight="400">确定性 MCP 客户端；check_resources + get_dataset_schema；失败关闭</text>
  <text x="1485.0" y="712.0" font-size="13" font-weight="400">落点：app/data_mcp/asset_mcp.py</text>
  <rect x="45.0" y="855.0" width="680.0" height="165.0" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="55.0" y="879.0" font-size="13" font-weight="700">数据运行时 Provider</text>
  <text x="55.0" y="898.0" font-size="13" font-weight="400">同源字段校验、受控 baseSQL 与连接载荷；assetRef 待配置</text>
  <text x="55.0" y="917.0" font-size="13" font-weight="400">落点：app/data_mcp/providers.py</text>
  <rect x="760.0" y="855.0" width="680.0" height="165.0" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="770.0" y="879.0" font-size="13" font-weight="700">SQLBot 适配</text>
  <text x="770.0" y="898.0" font-size="13" font-weight="400">管理登录、Assistant CRUD、运行容器 Secret、JWT 鉴权已验证；问数受同源门禁阻塞</text>
  <text x="770.0" y="917.0" font-size="13" font-weight="400">落点：app/sqlbot/client.py</text>
  <rect x="1475.0" y="855.0" width="680.0" height="165.0" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="1485.0" y="879.0" font-size="13" font-weight="700">前端与验收</text>
  <text x="1485.0" y="898.0" font-size="13" font-weight="400">创建/发布/开启；表格/图表/依据；配置阻塞项；自动化链路测试</text>
  <text x="1485.0" y="917.0" font-size="13" font-weight="400">落点：app/web · tests · docs</text>
  <text x="45.0" y="1120.0" font-size="19" font-weight="700">C. 真实端到端验收门禁</text>
  <rect x="45.0" y="1155.0" width="680.0" height="140.0" rx="9" fill="#FFEBEE" stroke="#D32F2F" stroke-width="3" stroke-dasharray="8 4" />
  <text x="55.0" y="1179.0" font-size="13" font-weight="700">同源资产</text>
  <text x="55.0" y="1198.0" font-size="13" font-weight="400">先证明 MCP resource 与 knowledge.sync_job 是同一资产；不得用无关有权样本代替</text>
  <rect x="760.0" y="1155.0" width="680.0" height="140.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="770.0" y="1179.0" font-size="13" font-weight="700">SQLBot SECRET_KEY</text>
  <text x="770.0" y="1198.0" font-size="13" font-weight="400">已取运行容器部署级 Secret 并通过临时 Assistant JWT 鉴权；API Key Secret</text>
  <text x="770.0" y="1217.0" font-size="13" font-weight="400">未混用</text>
  <rect x="1475.0" y="1155.0" width="680.0" height="140.0" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="1485.0" y="1179.0" font-size="13" font-weight="700">双向网络</text>
  <text x="1485.0" y="1198.0" font-size="13" font-weight="400">SQLBot 可达回调与数据库；Data Agent 可达 SQLBot 与外部 MCP</text>
  <rect x="45.0" y="1335.0" width="680.0" height="140.0" rx="9" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" />
  <text x="55.0" y="1359.0" font-size="13" font-weight="700">测试账号风险</text>
  <text x="55.0" y="1378.0" font-size="13" font-weight="400">高权限 MySQL 仅用于测试；只存本地环境变量；生产切换只读最小账号</text>
  <rect x="760.0" y="1335.0" width="680.0" height="140.0" rx="9" fill="#FFEBEE" stroke="#D32F2F" stroke-width="3" stroke-dasharray="8 4" />
  <text x="770.0" y="1359.0" font-size="13" font-weight="700">行权限事实</text>
  <text x="770.0" y="1378.0" font-size="13" font-weight="400">Asset MCP 未提供基础 SQL/行谓词；非空 requiredFilters 正样本仍缺失</text>
  <rect x="1475.0" y="1335.0" width="680.0" height="140.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="1485.0" y="1359.0" font-size="13" font-weight="700">失败关闭</text>
  <text x="1485.0" y="1378.0" font-size="13" font-weight="400">MCP 拒绝/超时、ticket 异常、schema 不一致均不得下发连接</text>
  <rect x="45.0" y="1570.0" width="1390.0" height="150.0" rx="9" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="55.0" y="1594.0" font-size="13" font-weight="700">最终边界</text>
  <text x="55.0" y="1613.0" font-size="13" font-weight="400">SQLBot 不得绕过 Data Agent 使用静态数据源；只有 Ticket 与外部 MCP 复核通过后，Data Agent 才返回临时连接和裁决后 Schema。随后仍由 SQLBot 执行 SQL——这是报告零改</text>
  <text x="55.0" y="1632.0" font-size="13" font-weight="400">SQLBot 的既定方案。</text>
  <rect x="1470.0" y="1570.0" width="690.0" height="150.0" rx="9" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="1480.0" y="1594.0" font-size="13" font-weight="700">当前实施结论</text>
  <text x="1480.0" y="1613.0" font-size="13" font-weight="400">SQLBot、数据库和部署 Secret 已就绪；真实 E2E 不伪造通过。当前核心阻塞仅剩同源</text>
  <text x="1480.0" y="1632.0" font-size="13" font-weight="400">assetRef；行权限与回调 CIDR 仍需生产验收。</text>
</svg>