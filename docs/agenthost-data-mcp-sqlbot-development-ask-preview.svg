  <text x="33.62" y="135.29999999999998" font-size="10" font-weight="700">1 用户提问</text>
  <text x="33.62" y="151.7" font-size="10" font-weight="400">已开启的问数智能体 Session</text>
  <rect x="206.64" y="213.2" width="214.01999999999998" height="82.0" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="214.01999999999998" y="233.7" font-size="10" font-weight="700">2 澄清并改写</text>
  <text x="214.01999999999998" y="250.1" font-size="10" font-weight="400">生成可独立执行问题</text>
  <text x="214.01999999999998" y="266.5" font-size="10" font-weight="400">HOST PARTIAL</text>
  <rect x="206.64" y="319.79999999999995" width="214.01999999999998" height="88.55999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="214.01999999999998" y="340.29999999999995" font-size="10" font-weight="700">3 调用 data.ask</text>
  <text x="214.01999999999998" y="356.7" font-size="10" font-weight="400">Claude SDK 进程内 MCP；注入 user/session</text>
  <text x="214.01999999999998" y="373.09999999999997" font-size="10" font-weight="400">POC LIVE</text>
  <rect x="440.34" y="434.59999999999997" width="275.52" height="95.11999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="447.71999999999997" y="455.09999999999997" font-size="10" font-weight="700">4 读取 agent / ask_session</text>
  <text x="447.71999999999997" y="471.5" font-size="10" font-weight="400">签发 60s Ticket；生成 Assistant JWT</text>
  <text x="447.71999999999997" y="487.9" font-size="10" font-weight="400">运行容器 SECRET_KEY 已验证</text>
  <rect x="993.8399999999999" y="553.5" width="250.92" height="90.19999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="1001.2199999999999" y="574.0" font-size="10" font-weight="700">5 assistant/start 或 question</text>
  <text x="1001.2199999999999" y="590.4" font-size="10" font-weight="400">Certificate 仅携带本次 Ticket</text>
  <text x="1001.2199999999999" y="606.8" font-size="10" font-weight="400">SQLBOT + POC CODE</text>
  <rect x="993.8399999999999" y="668.3" width="250.92" height="88.55999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="1001.2199999999999" y="688.8" font-size="10" font-weight="700">6 GET 动态数据源回调</text>
  <text x="1001.2199999999999" y="705.1999999999999" font-size="10" font-weight="400">X-Davinci-Ticket 原样转发</text>
  <text x="1001.2199999999999" y="721.5999999999999" font-size="10" font-weight="400">SQLBOT CODE</text>
  <rect x="440.34" y="783.0999999999999" width="275.52" height="91.83999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="447.71999999999997" y="803.5999999999999" font-size="10" font-weight="700">7 校验 Ticket</text>
  <text x="447.71999999999997" y="820.0" font-size="10" font-weight="400">user / agent / session / questionHash / 原子次数</text>
  <text x="447.71999999999997" y="836.4" font-size="10" font-weight="400">POC CODE</text>
  <rect x="735.54" y="897.9" width="238.61999999999998" height="91.83999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="742.92" y="918.4" font-size="10" font-weight="700">8 二次权限复核</text>
  <text x="742.92" y="934.8" font-size="10" font-weight="400">access.check_resources + get_dataset_schema</text>
  <text x="742.92" y="951.1999999999999" font-size="10" font-weight="400">CLIENT + LIVE MCP</text>
  <rect x="440.34" y="1012.6999999999999" width="275.52" height="91.83999999999999" rx="8" fill="#FFEBEE" stroke="#D32F2F" stroke-width="3" stroke-dasharray="8 4" />
  <text x="447.71999999999997" y="1033.2" font-size="10" font-weight="700">9 同源校验 + 字段投影</text>
  <text x="447.71999999999997" y="1049.6" font-size="10" font-weight="400">仅授权字段；必保字段 + Top40</text>
  <text x="447.71999999999997" y="1066.0" font-size="10" font-weight="400">同源 assetRef 尚未取得</text>
  <rect x="440.34" y="1127.5" width="275.52" height="91.83999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="447.71999999999997" y="1148.0" font-size="10" font-weight="700">10 返回动态数据源</text>
  <text x="447.71999999999997" y="1164.3999999999999" font-size="10" font-weight="400">DB 连接 + tables[].sql + fields</text>
  <text x="447.71999999999997" y="1180.8" font-size="10" font-weight="400">POC CODE；配置后启用</text>
  <rect x="993.8399999999999" y="1242.3" width="250.92" height="90.19999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="1001.2199999999999" y="1262.8" font-size="10" font-weight="700">11 NL2SQL / 校验 / 子查询替换</text>
  <text x="1001.2199999999999" y="1279.1999999999998" font-size="10" font-weight="400">只允许 SELECT / WITH</text>
  <text x="1001.2199999999999" y="1295.6" font-size="10" font-weight="400">SQLBOT CODE</text>
  <rect x="1264.4399999999998" y="1357.1" width="214.01999999999998" height="91.83999999999999" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" />
  <text x="1271.82" y="1377.6" font-size="10" font-weight="700">12 回调授权后连接 MySQL</text>
  <text x="1271.82" y="1394.0" font-size="10" font-weight="400">测试高权限账号；生产切只读最小账号</text>
  <text x="1271.82" y="1410.3999999999999" font-size="10" font-weight="400">POC 风险</text>
  <rect x="993.8399999999999" y="1471.8999999999999" width="250.92" height="95.11999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="1001.2199999999999" y="1492.3999999999999" font-size="10" font-weight="700">13 SSE + Record Data</text>
  <text x="1001.2199999999999" y="1508.8" font-size="10" font-weight="400">sql-data 是状态；行数据另取 record/{id}/data</text>
  <text x="1001.2199999999999" y="1525.1999999999998" font-size="10" font-weight="400">CODE</text>
  <rect x="440.34" y="1590.8" width="275.52" height="93.47999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="447.71999999999997" y="1611.3" font-size="10" font-weight="700">14 标准化 / 缓存 / 审计</text>
  <text x="447.71999999999997" y="1627.6999999999998" font-size="10" font-weight="400">首屏≤200、缓存≤1000、10min TTL、evidence</text>
  <text x="447.71999999999997" y="1644.1" font-size="10" font-weight="400">POC CODE</text>
  <rect x="206.64" y="1709.6999999999998" width="214.01999999999998" height="88.55999999999999" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="214.01999999999998" y="1730.1999999999998" font-size="10" font-weight="700">15 Host 核对并分析</text>
  <text x="214.01999999999998" y="1746.6" font-size="10" font-weight="400">SQL、口径和字段依据一致后作答</text>
  <text x="214.01999999999998" y="1763.0" font-size="10" font-weight="400">HOST PARTIAL</text>
  <rect x="26.24" y="1824.5" width="160.72" height="72.16" rx="8" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="33.62" y="1845.0" font-size="10" font-weight="700">16 表格 / 分析 / 图表</text>
  <text x="33.62" y="1861.3999999999999" font-size="10" font-weight="400">前端原生组件渲染</text>
  <rect x="1498.1399999999999" y="783.0999999999999" width="242.72" height="91.83999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="1505.52" y="803.5999999999999" font-size="10" font-weight="700">拒绝 A · invalid_ticket</text>
  <text x="1505.52" y="820.0" font-size="10" font-weight="400">缺失、过期、完成或超次数</text>
  <text x="1505.52" y="836.4" font-size="10" font-weight="400">FAIL-CLOSED CODE</text>
  <rect x="1498.1399999999999" y="1012.6999999999999" width="242.72" height="91.83999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="1505.52" y="1033.2" font-size="10" font-weight="700">拒绝 B · no_permission</text>
  <text x="1505.52" y="1049.6" font-size="10" font-weight="400">MCP 拒绝/超时、Schema 不同源或需行过滤</text>
  <text x="1505.52" y="1066.0" font-size="10" font-weight="400">FAIL-CLOSED CODE</text>
  <rect x="1498.1399999999999" y="1241.48" width="242.72" height="91.83999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="1505.52" y="1261.98" font-size="10" font-weight="700">拒绝 C · cannot_generate</text>
  <text x="1505.52" y="1278.3799999999999" font-size="10" font-weight="400">Top100 仅重试一次；仍失败即终止</text>
  <text x="1505.52" y="1294.78" font-size="10" font-weight="400">POC CODE</text>
