  <text x="42.0" y="179.0" font-size="13" font-weight="700">1 请求目录</text>
  <text x="42.0" y="198.0" font-size="13" font-weight="400">GET /api/sqlbot</text>
  <text x="42.0" y="217.0" font-size="13" font-weight="400">/catalog</text>
  <text x="42.0" y="236.0" font-size="13" font-weight="400">按 DW / DM / RPT</text>
  <text x="42.0" y="255.0" font-size="13" font-weight="400">浏览</text>
  <rect x="252.0" y="290.0" width="341.0" height="112.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="262.0" y="314.0" font-size="13" font-weight="700">2 宿主身份与范围门禁</text>
  <text x="262.0" y="333.0" font-size="13" font-weight="400">本机 mock 身份；仅映射 4/5/6</text>
  <text x="262.0" y="352.0" font-size="13" font-weight="400">目录开关独立于动态问数</text>
  <rect x="617.0" y="425.0" width="341.0" height="108.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="627.0" y="449.0" font-size="13" font-weight="700">3 管理账号换取 Token</text>
  <text x="627.0" y="468.0" font-size="13" font-weight="400">服务2 /mcp/access_token</text>
  <text x="627.0" y="487.0" font-size="13" font-weight="400">仅服务端持有管理凭证</text>
  <rect x="617.0" y="560.0" width="341.0" height="112.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="627.0" y="584.0" font-size="13" font-weight="700">4 校验数据源映射</text>
  <text x="627.0" y="603.0" font-size="13" font-weight="400">/datasource/list：ID 4/5/6</text>
  <text x="627.0" y="622.0" font-size="13" font-weight="400">名称与 StarRocks 类型均匹配</text>
  <rect x="982.0" y="695.0" width="311.0" height="108.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="992.0" y="719.0" font-size="13" font-weight="700">5 连接检查</text>
  <text x="992.0" y="738.0" font-size="13" font-weight="400">/datasource/check/{id}</text>
  <text x="992.0" y="757.0" font-size="13" font-weight="400">DW / DM / RPT 均为 true</text>
  <rect x="617.0" y="830.0" width="341.0" height="112.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="627.0" y="854.0" font-size="13" font-weight="700">6 读取已选表与表备注</text>
  <text x="627.0" y="873.0" font-size="13" font-weight="400">/datasource/tableList/{id}</text>
  <text x="627.0" y="892.0" font-size="13" font-weight="400">DW 23 / DM 19 / RPT 8</text>
  <rect x="617.0" y="965.0" width="341.0" height="112.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="627.0" y="989.0" font-size="13" font-weight="700">7 读取字段与自定义备注</text>
  <text x="627.0" y="1008.0" font-size="13" font-weight="400">/datasource/fieldList/{ds}/</text>
  <text x="627.0" y="1027.0" font-size="13" font-weight="400">{table}</text>
  <text x="627.0" y="1046.0" font-size="13" font-weight="400">共 3318 字段；3269 条非空备注</text>
  <rect x="982.0" y="1100.0" width="311.0" height="116.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="992.0" y="1124.0" font-size="13" font-weight="700">8 实时 Schema 对照</text>
  <text x="992.0" y="1143.0" font-size="13" font-weight="400">/datasource/getFields/{ds</text>
  <text x="992.0" y="1162.0" font-size="13" font-weight="400">}/{table}</text>
  <text x="992.0" y="1181.0" font-size="13" font-weight="400">三组样表字段均匹配；巡检表 105/105</text>
  <rect x="252.0" y="1240.0" width="341.0" height="116.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="262.0" y="1264.0" font-size="13" font-weight="700">9 宿主合并并过滤</text>
  <text x="262.0" y="1283.0" font-size="13" font-weight="400">只返回已选表/字段及备注</text>
  <text x="262.0" y="1302.0" font-size="13" font-weight="400">不返回连接配置、密码或签名密钥</text>
  <rect x="32.0" y="1380.0" width="196.0" height="118.0" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="42.0" y="1404.0" font-size="13" font-weight="700">10 返回本地目录 API</text>
  <text x="42.0" y="1423.0" font-size="13" font-weight="400">连接、表、字段、实时</text>
  <text x="42.0" y="1442.0" font-size="13" font-weight="400">Schema</text>
  <text x="42.0" y="1461.0" font-size="13" font-weight="400">50 表 / 3318</text>
  <text x="42.0" y="1480.0" font-size="13" font-weight="400">字段逐项一致</text>
