  <rect x="26.24" y="110.69999999999999" width="152.51999999999998" height="63.959999999999994" rx="8" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="33.62" y="131.2" font-size="10" font-weight="700">1 用户提问</text>
  <text x="33.62" y="147.6" font-size="10" font-weight="400">当前问数智能体会话</text>
  <rect x="198.44" y="200.89999999999998" width="205.82" height="78.72" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="205.82" y="221.39999999999998" font-size="10" font-weight="700">2 可信会话上下文</text>
  <text x="205.82" y="237.79999999999998" font-size="10" font-weight="400">服务端取得 user / agent / session</text>
  <text x="205.82" y="254.2" font-size="10" font-weight="400">HOST CODE</text>
  <rect x="198.44" y="299.29999999999995" width="205.82" height="77.08" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="205.82" y="319.79999999999995" font-size="10" font-weight="700">3 澄清与问题改写</text>
  <text x="205.82" y="336.2" font-size="10" font-weight="400">生成可独立执行问题</text>
  <text x="205.82" y="352.59999999999997" font-size="10" font-weight="400">HOST PARTIAL</text>
  <rect x="198.44" y="397.7" width="205.82" height="88.55999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="205.82" y="418.2" font-size="10" font-weight="700">4 调用 data.ask</text>
  <text x="205.82" y="434.59999999999997" font-size="10" font-weight="400">进程内 MCP；身份与 session 由 Host 注入</text>
  <text x="205.82" y="451.0" font-size="10" font-weight="400">HOST CODE</text>
  <rect x="423.94" y="508.4" width="267.32" height="95.11999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="431.32" y="528.9" font-size="10" font-weight="700">5 读取智能体与 Chat 映射</text>
  <text x="431.32" y="545.3" font-size="10" font-weight="400">签 Ticket：user / agent / session / questionHash / 60s</text>
  <text x="431.32" y="561.6999999999999" font-size="10" font-weight="400">POC CODE</text>
  <rect x="956.9399999999999" y="627.3" width="242.72" height="85.28" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="964.3199999999999" y="647.8" font-size="10" font-weight="700">6 assistant/start 或 question</text>
  <text x="964.3199999999999" y="664.1999999999999" font-size="10" font-weight="400">Assistant JWT + 请求级 Certificate</text>
  <text x="964.3199999999999" y="680.5999999999999" font-size="10" font-weight="400">SQLBOT CODE</text>
  <rect x="956.9399999999999" y="733.9" width="242.72" height="85.28" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="964.3199999999999" y="754.4" font-size="10" font-weight="700">7 GET 动态数据源回调</text>
  <text x="964.3199999999999" y="770.8" font-size="10" font-weight="400">X-Davinci-Ticket 原样转发</text>
  <text x="964.3199999999999" y="787.1999999999999" font-size="10" font-weight="400">SQLBOT CODE</text>
  <rect x="423.94" y="840.5" width="267.32" height="88.55999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="431.32" y="861.0" font-size="10" font-weight="700">8 校验 Ticket</text>
  <text x="431.32" y="877.4" font-size="10" font-weight="400">TTL、绑定关系、原子计数、最多两次回调</text>
  <text x="431.32" y="893.8" font-size="10" font-weight="400">POC CODE</text>
  <rect x="710.9399999999999" y="955.3" width="226.32" height="88.55999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="718.3199999999999" y="975.8" font-size="10" font-weight="700">9 access.check_resources</text>
  <text x="718.3199999999999" y="992.1999999999999" font-size="10" font-weight="400">按 ticket 用户重新复核全部资源</text>
  <text x="718.3199999999999" y="1008.5999999999999" font-size="10" font-weight="400">客户端 + 外部工具 LIVE</text>
  <rect x="710.9399999999999" y="1066.0" width="226.32" height="90.19999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="718.3199999999999" y="1086.5" font-size="10" font-weight="700">10 catalog.get_dataset_schema</text>
  <text x="718.3199999999999" y="1102.8999999999999" font-size="10" font-weight="400">授权字段、requiredFilters、metadataVersion</text>
  <text x="718.3199999999999" y="1119.3" font-size="10" font-weight="400">客户端 + 外部工具 LIVE</text>
  <rect x="423.94" y="1180.8" width="267.32" height="95.11999999999999" rx="8" fill="#FFEBEE" stroke="#D32F2F" stroke-width="3" stroke-dasharray="8 4" />
  <text x="431.32" y="1201.3" font-size="10" font-weight="700">11 同源校验与字段投影</text>
  <text x="431.32" y="1217.6999999999998" font-size="10" font-weight="400">字段一致才放行；必保字段 + Top40</text>
  <text x="431.32" y="1234.1" font-size="10" font-weight="400">同源 assetRef 尚未取得</text>
  <rect x="423.94" y="1299.6999999999998" width="267.32" height="91.83999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="431.32" y="1320.1999999999998" font-size="10" font-weight="700">12 构造动态数据源</text>
  <text x="431.32" y="1336.6" font-size="10" font-weight="400">连接 + tables[].sql + 授权 fields</text>
  <text x="431.32" y="1353.0" font-size="10" font-weight="400">POC CODE；配置后启用</text>
  <rect x="956.9399999999999" y="1418.6" width="242.72" height="85.28" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="964.3199999999999" y="1439.1" font-size="10" font-weight="700">13 接收裁决后数据源</text>
  <text x="964.3199999999999" y="1455.5" font-size="10" font-weight="400">ACL 失败时不得获得 DB 凭据</text>
  <text x="964.3199999999999" y="1471.8999999999999" font-size="10" font-weight="400">SQLBOT CONTRACT</text>
  <rect x="956.9399999999999" y="1529.3" width="242.72" height="91.83999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="964.3199999999999" y="1549.8" font-size="10" font-weight="700">14 NL2SQL / 校验 / 子查询替换</text>
  <text x="964.3199999999999" y="1566.1999999999998" font-size="10" font-weight="400">logicalSql → real_execute_sql</text>
  <text x="964.3199999999999" y="1582.6" font-size="10" font-weight="400">SQLBOT CODE</text>
  <rect x="1219.34" y="1648.1999999999998" width="201.72" height="95.11999999999999" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" />
  <text x="1226.72" y="1668.6999999999998" font-size="10" font-weight="700">15 回调授权后连接数据库</text>
  <text x="1226.72" y="1685.1" font-size="10" font-weight="400">测试可用高权限 MySQL；生产必须只读最小账号</text>
  <text x="1226.72" y="1701.5" font-size="10" font-weight="400">POC 风险</text>
  <rect x="956.9399999999999" y="1767.1" width="242.72" height="91.83999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="964.3199999999999" y="1787.6" font-size="10" font-weight="700">16 SSE + Record Data</text>
  <text x="964.3199999999999" y="1804.0" font-size="10" font-weight="400">先取 recordId，再 GET /record/{id}/data</text>
  <text x="964.3199999999999" y="1820.3999999999999" font-size="10" font-weight="400">SQLBOT + POC CODE</text>
  <rect x="423.94" y="1886.0" width="267.32" height="93.47999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="431.32" y="1906.5" font-size="10" font-weight="700">17 标准化 / 缓存 / evidence</text>
  <text x="431.32" y="1922.8999999999999" font-size="10" font-weight="400">首屏≤200、缓存≤1000、10min TTL、审计</text>
  <text x="431.32" y="1939.3" font-size="10" font-weight="400">POC CODE</text>
  <rect x="198.44" y="2004.8999999999999" width="205.82" height="83.64" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="205.82" y="2025.3999999999999" font-size="10" font-weight="700">18 Host 业务分析</text>
  <text x="205.82" y="2041.8" font-size="10" font-weight="400">核对 SQL 与取数依据后作答</text>
  <text x="205.82" y="2058.2" font-size="10" font-weight="400">HOST PARTIAL</text>
  <rect x="26.24" y="2115.6" width="152.51999999999998" height="72.16" rx="8" fill="#FFFFFF" stroke="#455A64" stroke-width="2" />
  <text x="33.62" y="2136.1" font-size="10" font-weight="700">19 表格 / 分析 / 图表</text>
  <text x="33.62" y="2152.5" font-size="10" font-weight="400">前端获得明确成功终态</text>
  <rect x="1440.74" y="838.8599999999999" width="234.51999999999998" height="91.83999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="1448.12" y="859.3599999999999" font-size="10" font-weight="700">失败终态 A · invalid_ticket</text>
  <text x="1448.12" y="875.76" font-size="10" font-weight="400">无效、过期、完成或超次数</text>
  <text x="1448.12" y="892.16" font-size="10" font-weight="400">FAIL-CLOSED CODE</text>
  <rect x="1440.74" y="1180.8" width="234.51999999999998" height="91.83999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="1448.12" y="1201.3" font-size="10" font-weight="700">失败终态 B · asset_mismatch</text>
  <text x="1448.12" y="1217.6999999999998" font-size="10" font-weight="400">无权、超时、Schema 不同源或需行过滤</text>
  <text x="1448.12" y="1234.1" font-size="10" font-weight="400">FAIL-CLOSED CODE</text>
  <rect x="1440.74" y="1530.9399999999998" width="234.51999999999998" height="88.55999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="1448.12" y="1551.4399999999998" font-size="10" font-weight="700">失败终态 C · cannot_generate</text>
  <text x="1448.12" y="1567.84" font-size="10" font-weight="400">仅一次 Top100；仍失败则终止</text>
  <text x="1448.12" y="1584.24" font-size="10" font-weight="400">POC CODE</text>
