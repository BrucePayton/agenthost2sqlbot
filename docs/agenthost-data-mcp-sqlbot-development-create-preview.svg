  <text x="1329.22" y="1451.3999999999999" font-size="10" font-weight="400">服务端注入可信 agentId；Host 不存主数据</text>
  <text x="1329.22" y="1467.8" font-size="10" font-weight="400">HOST CODE</text>
  <rect x="1321.84" y="1533.3999999999999" width="242.72" height="91.83999999999999" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="1329.22" y="1553.8999999999999" font-size="10" font-weight="700">13 装载问数 Workspace</text>
  <text x="1329.22" y="1570.3" font-size="10" font-weight="400">ClaudeAgentRuntime + data.ask MCP + 分析规则</text>
  <text x="1329.22" y="1586.6999999999998" font-size="10" font-weight="400">PARTIAL</text>
