  <text x="33.62" y="135.29999999999998" font-size="10" font-weight="700">1 选择 1–5 个数据集</text>
  <text x="33.62" y="151.7" font-size="10" font-weight="400">名称、简介、datasetRef</text>
  <text x="33.62" y="168.1" font-size="10" font-weight="400">POC UI 已有；目录仍是固定 Provider</text>
  <rect x="231.23999999999998" y="233.7" width="283.71999999999997" height="88.55999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="238.61999999999998" y="254.2" font-size="10" font-weight="700">2 POST /api/data-agents</text>
  <text x="238.61999999999998" y="270.59999999999997" font-size="10" font-weight="400">只信服务端身份；校验数量与状态</text>
  <text x="238.61999999999998" y="287.0" font-size="10" font-weight="400">POC CODE</text>
  <rect x="534.64" y="352.59999999999997" width="250.92" height="95.11999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="542.02" y="373.09999999999997" font-size="10" font-weight="700">3 access.check_resources</text>
  <text x="542.02" y="389.5" font-size="10" font-weight="400">以可信 obId=159358 复核全部 refs</text>
  <text x="542.02" y="405.9" font-size="10" font-weight="400">客户端 + 外部工具 LIVE</text>
  <rect x="534.64" y="471.5" width="250.92" height="95.11999999999999" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="542.02" y="491.99999999999994" font-size="10" font-weight="700">4 catalog.get_dataset_schema</text>
  <text x="542.02" y="508.4" font-size="10" font-weight="400">取得授权字段、requiredFilters、版本</text>
  <text x="542.02" y="524.8" font-size="10" font-weight="400">客户端 + 外部工具 LIVE</text>
  <rect x="231.23999999999998" y="590.4" width="283.71999999999997" height="95.11999999999999" rx="8" fill="#FFEBEE" stroke="#D32F2F" stroke-width="3" stroke-dasharray="8 4" />
  <text x="238.61999999999998" y="610.9" font-size="10" font-weight="700">5 同源映射门禁</text>
  <text x="238.61999999999998" y="627.3" font-size="10" font-weight="400">MCP resource ↔ knowledge.sync_job / 物理字段</text>
  <text x="238.61999999999998" y="643.6999999999999" font-size="10" font-weight="400">代码已失败关闭；同源 assetRef 尚缺</text>
  <rect x="805.2399999999999" y="709.3" width="226.32" height="90.19999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="812.62" y="729.8" font-size="10" font-weight="700">6 保存草稿与数据集快照</text>
  <text x="812.62" y="746.1999999999999" font-size="10" font-weight="400">data_agent + data_agent_dataset + audit</text>
  <text x="812.62" y="762.5999999999999" font-size="10" font-weight="400">POC CODE</text>
  <rect x="231.23999999999998" y="828.1999999999999" width="283.71999999999997" height="95.11999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="238.61999999999998" y="848.6999999999999" font-size="10" font-weight="700">7 幂等同步高级小助手</text>
  <text x="238.61999999999998" y="865.0999999999999" font-size="10" font-weight="400">configuration 只含回调地址与凭证映射</text>
  <text x="238.61999999999998" y="881.5" font-size="10" font-weight="400">POC CODE</text>
  <rect x="1051.24" y="947.0999999999999" width="250.92" height="88.55999999999999" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="1058.62" y="967.5999999999999" font-size="10" font-weight="700">8 创建 type=1 Assistant</text>
  <text x="1058.62" y="983.9999999999999" font-size="10" font-weight="400">管理账号调用；不登记静态数据源</text>
  <text x="1058.62" y="1000.4" font-size="10" font-weight="400">SQLBOT CODE</text>
  <rect x="805.2399999999999" y="1066.0" width="226.32" height="91.83999999999999" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" />
  <text x="812.62" y="1086.5" font-size="10" font-weight="700">9 保存 assistantId / 发布</text>
  <text x="812.62" y="1102.8999999999999" font-size="10" font-weight="400">同步失败不得发布；更新/删除需补偿</text>
  <text x="812.62" y="1119.3" font-size="10" font-weight="400">POC PARTIAL</text>
