[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.21"

[storage]
allowed_host_paths = []
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[docker]
network_mode = "bridge"
# The server itself runs in Compose while sandbox ports are published by the
# host Docker daemon. This hostname keeps control-plane callbacks reachable on
# Docker Desktop and Linux installations that provide the host-gateway alias.
host_ip = "host.docker.internal"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
apparmor_profile = ""
pids_limit = 512
seccomp_profile = ""

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.4"
mode = "dns+nft"

[renew_intent]
enabled = false
min_interval_seconds = 60
